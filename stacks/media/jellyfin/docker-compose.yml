version: "3.8"

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /home/adeoliveira/media:/media:ro
    ports:
      - 8096:8096
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
