version: "3.8"

services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=America/Sao_Paulo
      - NTFY_BASE_URL=http://ntfy.home.local
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
    volumes:
      - ./cache:/var/lib/ntfy
      - ./config:/etc/ntfy
    ports:
      - 8081:80
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
