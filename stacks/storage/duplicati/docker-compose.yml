version: "3.8"

services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config:/config
      - /home/adeoliveira:/source:ro
      - /home/adeoliveira/backups:/backups
    ports:
      - 8200:8200
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
